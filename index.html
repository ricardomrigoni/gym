<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Diário de Treino</title>
<meta name="theme-color" content="#121614">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treino">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap">
<style>
/* Layout: app de academia, uma coluna para celular — barra superior fixa, conteúdo, navegação inferior com 4 abas; sessão de treino em tela cheia com cronômetro de descanso fixo no rodapé */
:root{
  --bg:#121614; --surface:#1B211E; --raise:#232A26; --line:#303934;
  --ink:#ECEFEA; --muted:#A4ACA6; --faint:#737B75;
  --accent:#FF6A38; --accent-ink:#1A0D07; --accent-soft:#3A1F14;
  --ok:#4CC39E; --ok-soft:#173229; --warn:#F2B84B; --bad:#FF7B5F; --bad-soft:#3B1C15;
  --f-display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:16px; --nav:64px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F1F2EE; --surface:#FFFFFF; --raise:#E9EBE5; --line:#D5D8D0;
  --ink:#151B18; --muted:#5D655F; --faint:#8A918B;
  --accent:#D9481A; --accent-ink:#FFFFFF; --accent-soft:#FBE3D8;
  --ok:#1E7A62; --ok-soft:#DCEFE7; --warn:#A86A00; --bad:#B8321A; --bad-soft:#F8DDD6; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#F1F2EE; --surface:#FFFFFF; --raise:#E9EBE5; --line:#D5D8D0;
  --ink:#151B18; --muted:#5D655F; --faint:#8A918B;
  --accent:#D9481A; --accent-ink:#FFFFFF; --accent-soft:#FBE3D8;
  --ok:#1E7A62; --ok-soft:#DCEFE7; --warn:#A86A00; --bad:#B8321A; --bad-soft:#F8DDD6; color-scheme:light}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,input,a,summary{touch-action:manipulation}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--f-display);line-height:1;text-wrap:balance}
.eyebrow{font:600 11px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.shell{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(var(--nav) + 28px + env(safe-area-inset-bottom,0px))}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand h1{font-size:26px;font-weight:800;text-transform:uppercase;letter-spacing:.01em}
.brand h1 span{color:var(--accent)}
.today{font-size:12.5px;color:var(--muted);font-weight:600}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav)}
.nav button{display:grid;place-items:center;align-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--faint)}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--accent)}

/* home */
.sec{display:grid;gap:12px;margin-top:22px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec-h h2{font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.next{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;display:grid;gap:14px}
.next::after{content:attr(data-l);position:absolute;right:-6px;top:-22px;font:800 170px/1 var(--f-display);color:var(--accent);opacity:.14;pointer-events:none}
.next .lab{display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:4px 10px;background:var(--accent);color:var(--accent-ink)}
.pill.live{background:var(--ok);color:var(--bg)}
.pill.live::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.next h3{font-size:42px;font-weight:800;text-transform:uppercase;letter-spacing:-.005em;position:relative}
.next h3 small{display:block;font:600 13px/1.2 var(--f-body);letter-spacing:.1em;color:var(--muted);margin-bottom:6px}
.facts{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);position:relative}
.facts b{color:var(--ink);font-weight:700}
.focusrow{display:flex;flex-wrap:wrap;gap:6px;position:relative}
.mchip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:7px;background:var(--raise);color:var(--muted)}
.mchip.p{background:var(--accent-soft);color:var(--accent)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:15px 18px;font:700 19px/1 var(--f-display);letter-spacing:.05em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);width:100%;position:relative}
.btn svg{width:18px;height:18px}
.btn.ghost{background:var(--raise);color:var(--ink)}
.btn.ok{background:var(--ok);color:var(--bg)}
.btn.sm{padding:11px 14px;font-size:16px;width:auto}
.btn:active{transform:scale(.985)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.week{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.wd{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 6px 8px;display:grid;justify-items:center;gap:3px}
.wd .d{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.wd .l{font:800 24px/1 var(--f-display)}
.wd .s{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line)}
.wd .s svg{width:11px;height:11px}
.wd.done{background:var(--ok-soft);border-color:transparent}.wd.done .s{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.wd.nx{border-color:var(--accent)}.wd.nx .l{color:var(--accent)}

.wlist{display:grid;gap:8px}
.wcard{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.wcard .big{font:800 44px/.85 var(--f-display);color:var(--faint);text-align:center}
.wcard.nx .big{color:var(--accent)}
.wcard .t{min-width:0;display:grid;gap:3px}
.wcard .t b{font:700 19px/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.01em}
.wcard .t span{font-size:12.5px;color:var(--muted)}
.wcard .go{width:36px;height:36px;border-radius:50%;background:var(--raise);display:grid;place-items:center;color:var(--muted)}
.wcard .go svg{width:16px;height:16px}

/* plano / mapa */
.map-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.map{border-collapse:separate;border-spacing:3px;width:100%;font-size:12.5px}
.map th{font:700 10.5px/1.15 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);text-align:center;padding:3px}
.map th.row{text-align:left;color:var(--muted);font:600 12.5px var(--f-body);letter-spacing:0;text-transform:none;white-space:nowrap}
.map td{text-align:center;border-radius:6px;height:28px;font:600 12px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink);min-width:34px}
.map td.z{background:var(--raise);color:transparent}
.map td.f{box-shadow:inset 0 0 0 2px var(--accent)}
.map td.tot{background:transparent;font-weight:700}
.hint{font-size:12.5px;color:var(--faint);margin:0}
.days{display:grid;gap:8px}
.dayc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px}
.dayc .h{display:flex;align-items:baseline;gap:10px}
.dayc .h b{font:800 30px/1 var(--f-display);color:var(--accent)}
.dayc .h span{font:700 18px/1 var(--f-display);text-transform:uppercase}
.dayc .h i{font-style:normal;margin-left:auto;font-size:12px;color:var(--faint);font-weight:600}
.dayc p{margin:0;font-size:13.5px;color:var(--muted)}
.acc{display:grid;gap:8px}
.acc details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.acc summary{list-style:none;cursor:pointer;padding:14px 16px;font:700 18px/1.15 var(--f-display);text-transform:uppercase;display:flex;justify-content:space-between;gap:10px}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";color:var(--accent);font-size:22px;line-height:.8}
.acc details[open] summary::after{content:"–"}
.acc .a{padding:0 16px 14px;font-size:14px;color:var(--muted);display:grid;gap:8px}
.acc .a p{margin:0}.acc .a b{color:var(--ink)}
.acc ol{margin:0;padding-left:18px;display:grid;gap:6px}

/* histórico */
.hist{display:grid;gap:8px}
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.hcard summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 14px}
.hcard summary::-webkit-details-marker{display:none}
.hcard .big{font:800 34px/1 var(--f-display);color:var(--accent);text-align:center}
.hcard .t{display:grid;gap:2px;min-width:0}
.hcard .t b{font-weight:700;font-size:14.5px}
.hcard .t span{font-size:12.5px;color:var(--muted)}
.hcard .v{font:600 12.5px var(--f-mono);color:var(--muted);text-align:right}
.hdet{padding:0 14px 12px;display:grid;gap:6px}
.hex{display:grid;grid-template-columns:1fr auto;gap:8px;font-size:13px;border-top:1px solid var(--line);padding-top:6px}
.hex span:last-child{font-family:var(--f-mono);color:var(--muted);text-align:right;font-size:12px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px 18px;text-align:center;color:var(--muted);display:grid;gap:6px;justify-items:center}
.empty svg{width:34px;height:34px;color:var(--faint)}
.empty b{color:var(--ink);font-size:15px}

/* ajustes */
.set-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px}
.set-card h3{font-size:18px;text-transform:uppercase;font-weight:700}
.set-card p{margin:0;font-size:13.5px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chipb{min-width:46px;height:42px;border-radius:12px;border:1.5px solid var(--line);font:800 20px/1 var(--f-display);display:grid;place-items:center}
.chipb.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);color:var(--ink);font:500 16px/1.4 var(--f-mono);resize:vertical}
.msg{font-size:13px;font-weight:600;color:var(--ok);min-height:1em}
.msg.bad{color:var(--bad)}

/* ===== sessão ===== */
.sess-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:10px 10px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.sess-bar{display:flex;align-items:center;gap:10px}
.iconb{width:40px;height:40px;border-radius:12px;background:var(--raise);display:grid;place-items:center;flex:0 0 auto}
.iconb svg{width:18px;height:18px}
.sess-t{flex:1;min-width:0;display:grid;gap:2px}
.sess-t b{font:800 22px/1 var(--f-display);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess-t b span{color:var(--accent)}
.sess-t i{font-style:normal;font-size:12px;color:var(--muted);font-weight:600}
.clock{font:700 20px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.prog{height:6px;border-radius:3px;background:var(--raise);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}

.station{display:grid;gap:8px;margin-top:16px}
.st-h{display:flex;align-items:baseline;gap:8px;padding:0 2px}
.st-n{font:700 11px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.st-t{font:700 16px/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em;color:var(--muted)}

.exc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.exc.done{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.exh{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:center;padding:12px;width:100%;text-align:left}
.th{width:58px;height:58px;border-radius:12px;background:var(--raise);overflow:hidden;position:relative}
.th .fig{width:100%;height:100%}
.exh .tt{min-width:0;display:grid;gap:3px}
.exh .nm{font:700 18px/1.08 var(--f-display);letter-spacing:.005em}
.exh .fo{font-size:12.5px;color:var(--accent);font-weight:700}
.exh .rx{font:600 12px/1.2 var(--f-mono);color:var(--muted)}
.cnt{display:grid;justify-items:end;gap:4px}
.ring{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--f-mono);background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--raise) 0);position:relative}
.ring::before{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--surface)}
.ring span{position:relative}
.ring.full{background:var(--ok);color:var(--bg)}.ring.full::before{display:none}
.tagx{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--raise);color:var(--muted)}
.tagx.e{background:var(--accent);color:var(--accent-ink)}
.tagx.b{background:var(--ink);color:var(--bg)}
.exb{padding:0 12px 12px;display:grid;gap:10px}
.exb[hidden]{display:none}
.bigfig{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:start}
.bigfig .th{width:120px;height:120px}
.tip{margin:0;font-size:13.5px;color:var(--muted)}
.how summary{list-style:none;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--ink);display:inline-flex;gap:6px;border:1px solid var(--line);border-radius:8px;padding:5px 10px}
.how summary::-webkit-details-marker{display:none}
.how summary::after{content:"+";color:var(--accent)}
.how[open] summary::after{content:"–"}
.how ol{margin:8px 0 0;padding-left:18px;font-size:13.5px;display:grid;gap:4px}
.how p{margin:6px 0 0;font-size:12.5px;color:var(--muted)}

.sets{display:grid;gap:6px}
.shead,.srow{display:grid;grid-template-columns:44px 1fr 1fr 52px;gap:8px;align-items:center}
.shead{font:700 10.5px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:0 2px}
.srow{background:var(--raise);border-radius:12px;padding:6px}
.srow .n{font:800 20px/1 var(--f-display);text-align:center;color:var(--muted)}
.fld{position:relative}
.fld input{width:100%;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:700 18px/1 var(--f-mono);font-variant-numeric:tabular-nums;text-align:center;padding:0 22px 0 6px}
.fld input::placeholder{color:var(--faint);font-weight:500}
.fld em{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-style:normal;font-size:11px;color:var(--faint);font-weight:600;pointer-events:none}
.ck{width:52px;height:44px;border-radius:10px;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--faint);background:var(--surface)}
.ck svg{width:22px;height:22px}
.srow.ok{background:var(--ok-soft)}
.srow.ok .ck{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.srow.ok .n{color:var(--ok)}
.srow.ok input{border-color:transparent}
.last{font-size:12px;color:var(--faint);padding:0 2px}
.last b{color:var(--muted);font-family:var(--f-mono);font-weight:600}
.bw{font-size:12px;color:var(--muted);text-align:center}

.finish{margin-top:22px;display:grid;gap:8px}
.danger{font-size:13px;color:var(--bad);font-weight:600;text-align:center;padding:8px}

/* descanso */
.rest{position:fixed;left:0;right:0;bottom:0;z-index:35;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none}
.rest-in{max-width:560px;margin:0 auto 10px;background:var(--ink);color:var(--bg);border-radius:18px;padding:10px 10px 10px 16px;display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;pointer-events:auto;box-shadow:0 10px 30px rgb(0 0 0 / .35);position:relative;overflow:hidden}
.rest-in .bar{position:absolute;left:0;bottom:0;height:4px;background:var(--accent);transition:width .25s linear}
.rest-in .lb{display:grid;gap:1px}
.rest-in .lb small{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.rest-in .lb b{font:700 28px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.rest-in button{height:40px;border-radius:12px;padding:0 12px;font-weight:700;font-size:13.5px;background:color-mix(in srgb,var(--bg) 14%,transparent)}
.rest-in.go{background:var(--ok);color:var(--bg)}
.rest-in.go .bar{display:none}
.has-rest .shell{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}

/* modal */
.scrim{position:fixed;inset:0;z-index:50;background:rgb(0 0 0 / .55);display:grid;align-items:end;justify-items:center;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.sheet{width:100%;max-width:520px;background:var(--surface);border-radius:22px;padding:20px;display:grid;gap:14px;max-height:calc(100% - 40px);overflow:auto}
.sheet h2{font-size:30px;text-transform:uppercase;font-weight:800}
.sheet p{margin:0;color:var(--muted);font-size:14.5px}
.sumgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sumgrid div{background:var(--raise);border-radius:12px;padding:10px;display:grid;gap:2px}
.sumgrid b{font:800 26px/1 var(--f-display);font-variant-numeric:tabular-nums}
.sumgrid span{font-size:11.5px;color:var(--muted);font-weight:600}
.ups{display:grid;gap:6px}
.up{display:flex;gap:8px;align-items:center;font-size:13.5px;background:var(--ok-soft);border-radius:10px;padding:8px 10px}
.up svg{width:16px;height:16px;color:var(--ok);flex:0 0 auto}

.install{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.install b{font:700 18px/1.1 var(--f-display);text-transform:uppercase}
.install p{margin:0;font-size:13.5px;color:var(--muted)}
.install .row2 .btn{font-size:16px;padding:12px}
.ok-line{display:flex;align-items:center;gap:8px;color:var(--ok);font-weight:700;font-size:14px}
.ok-line svg{width:18px;height:18px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted);background:var(--raise);border-radius:999px;padding:6px 10px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.sync.s-ok i{background:var(--ok)} .sync.s-pend i{background:var(--warn)} .sync.s-err i{background:var(--bad)} .sync.s-busy i{background:var(--accent);animation:pulse 1s infinite}
.form{display:grid;gap:8px}
.form input{height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:500 16px var(--f-body);padding:0 12px;width:100%}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px}
.kv span:nth-child(odd){color:var(--faint)}
.kv span:nth-child(even){color:var(--ink);font-weight:600;min-width:0;overflow-wrap:anywhere}
/* figuras */
.fig{width:100%;height:100%;display:block}
.fig .lb{stroke:var(--ink);stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round;fill:none}
.fig .far{opacity:.32}
.fig .hd{fill:var(--ink)}
.fig .eq{stroke:var(--faint);stroke-width:2.5;fill:none;stroke-linecap:round}
.fig .bn{stroke:var(--faint);stroke-width:7;stroke-linecap:round;opacity:.5}
.fig .eqf{fill:var(--faint);opacity:.7}
.fig .gr{stroke:var(--line);stroke-width:2}
.fig .cb{stroke:var(--faint);stroke-width:1.5;stroke-dasharray:4 3}
.fig .ld{stroke:var(--accent);stroke-width:3;fill:none;stroke-linecap:round}
.fig .ldf{fill:var(--accent)}
.fig .pd{fill:var(--faint)}
.fig .ghost{opacity:.22}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const NS="http://www.w3.org/2000/svg";
const add=(a,b)=>[a[0]+b[0],a[1]+b[1]];
function complete(q,v){
  q={...q};
  if(v!=="front"){
    if(q.k1&&!q.k2) q.k2=add(q.k1,[-4,0]);
    if(q.a1&&!q.a2) q.a2=add(q.a1,[-4,0]);
    if(q.e1&&!q.e2) q.e2=add(q.e1,[-4,-1]);
    if(q.w1&&!q.w2) q.w2=add(q.w1,[-4,-1]);
    if(!q.t1) q.t1=add(q.a1,[9,0]);
    if(!q.t2) q.t2=add(q.t1,[-4,0]);
  }
  return q;
}
function mk(tag,attrs,parent){const el=document.createElementNS(NS,tag);for(const k in attrs)el.setAttribute(k,attrs[k]);parent&&parent.appendChild(el);return el;}
function skeleton(g,v){
  const o={};
  const far=mk("g",{class:v==="front"?"":"far"},g);
  o.leg2=mk("polyline",{class:"lb"},far); o.arm2=mk("polyline",{class:"lb"},far);
  const near=mk("g",{},g);
  if(v==="front"){ o.hips=mk("line",{class:"lb"},near); o.shl=mk("line",{class:"lb"},near); }
  o.torso=mk("line",{class:"lb"},near); o.leg1=mk("polyline",{class:"lb"},near); o.arm1=mk("polyline",{class:"lb"},near);
  o.head=mk("circle",{class:"hd",r:9},near);
  return o;
}
function propsEls(g,props){
  return (props||[]).map(pr=>{
    const e={pr};
    switch(pr.k){
      case "plate": e.el=mk("circle",{class:"ld",r:pr.r||10},g); break;
      case "db": e.el=mk("rect",{class:"ldf",width:16,height:7,rx:2},g); break;
      case "dbV": e.el=mk("rect",{class:"ldf",width:8,height:18,rx:2},g); break;
      case "barS": e.el=mk("circle",{class:"ld",r:6},g); break;
      case "handle": e.el=mk("line",{class:"ld"},g); break;
      case "grip": e.el=mk("line",{class:"ld"},g); break;
      case "rope": e.el=mk("path",{class:"ld"},g); break;
      case "pad": e.el=mk("circle",{class:"pd",r:5},g); break;
      case "padL": e.el=mk("rect",{class:"pd",width:22,height:7,rx:3},g); break;
      case "padV": e.el=mk("rect",{class:"pd",width:7,height:20,rx:3},g); break;
      case "plate45": e.el=mk("line",{class:"ld"},g); break;
      case "cable": case "cableMid": e.el=mk("line",{class:"cb"},g); break;
      case "barW": e.el=mk("line",{class:"ld"},g); break;
    }
    return e;
  });
}
const pts=a=>a.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
const L=(el,a,b)=>{el.setAttribute("x1",a[0]);el.setAttribute("y1",a[1]);el.setAttribute("x2",b[0]);el.setAttribute("y2",b[1]);};

const MUSC=["Peito","Costas","Ombros","Bíceps","Tríceps","Quadríceps","Posterior","Glúteo","Adutores","Panturrilha","Abdômen"];
function mapHTML(){
  const grid=MUSC.map(r=>PLAN.map(w=>w.ex.reduce((a,e)=>{const n=e.m[r]; return a+(n?nSets(e)*(n>=3?1:.5):0);},0)));
  const max=Math.max(...grid.flat()), fmt=n=>n%1?n.toFixed(1).replace(".",","):n;
  let h='<tr><th></th>'+PLAN.map(w=>`<th>${w.day}<br>${w.id}</th>`).join("")+'<th>Sem.</th></tr>';
  MUSC.forEach((r,i)=>{ const fd=PLAN.map(w=>w.ex.some(e=>(e.m[r]||0)>=3)), tot=grid[i].reduce((a,b)=>a+b,0);
    h+=`<tr><th class="row">${r}</th>`+grid[i].map((v,j)=>v?`<td class="${fd[j]?'f':''}" style="background:color-mix(in srgb,var(--accent) ${Math.round(14+v/max*66)}%,var(--surface))">${fmt(v)}</td>`:'<td class="z">0</td>').join("")+`<td class="tot">${fmt(tot)}</td></tr>`; });
  return h;
}

/* ---------- render ---------- */
function render(){
  FIGS.forEach(f=>io&&io.unobserve(f.svg)); FIGS=[];
  const app=$("#app");
  $("#nav").hidden=inSession&&!!S.active;
  if(inSession&&S.active) app.innerHTML=renderSession();
  else{ inSession=false; app.innerHTML= tab==="plan"?renderPlan(): tab==="hist"?renderHist(): tab==="more"?renderMore(): renderHome(); }
  document.querySelectorAll("#nav [data-tab]").forEach(b=>{ b.classList.toggle("on",b.dataset.tab===tab); b.setAttribute("aria-current",b.dataset.tab===tab?"page":"false"); });
  document.querySelectorAll("#app svg[data-fig]").forEach(s=>mountFig(s,s.dataset.fig));
  tickClock();
}
function tickClock(){ const c=$("#clock"); if(!c||!S.active) return; const s=Math.floor((Date.now()-S.active.start)/1000); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), ss=String(s%60).padStart(2,"0"); c.textContent=h?`${h}:${String(m).padStart(2,"0")}:${ss}`:`${m}:${ss}`; }
setInterval(tickClock,1000);
function updateCounts(){ const c=sessCounts(); const sc=$("#sc"), pg=$("#pg"); if(sc) sc.textContent=`${c.d} de ${c.t} séries`; if(pg) pg.style.width=(c.t?c.d/c.t*100:0)+"%"; }

/* ---------- ações ---------- */
function toggleSet(i,j){
  const a=S.active, w=W(a.w), e=w.ex[i], s=a.sets[i][j];
  s.ok=!s.ok; save();
  const row=document.querySelector(`.srow[data-i="${i}"][data-j="${j}"]`);
  if(row){ row.classList.toggle("ok",s.ok); row.querySelector("[data-ck]").setAttribute("aria-pressed",s.ok); }
  const card=$("#ex-"+i); if(card){ const hd=card.querySelector(".exh"); const tmp=document.createElement("div"); tmp.innerHTML=exHeader(w,e,i,true); const svgOld=hd.querySelector(".th"); const nh=tmp.firstElementChild; nh.querySelector(".th").replaceWith(svgOld); hd.replaceWith(nh); card.classList.toggle("done",exDone(i)); }
  updateCounts();
  if(!s.ok) return;
  if(e.bi && !restSec(e)){ const p=w.ex.find((x,k)=>k!==i&&x.bi===e.bi); if(p) nowCue(p.n); }
  else if(restSec(e)) startRest(restSec(e), e.n);
  if(exDone(i)){ const nxt=w.ex.findIndex((x,k)=>k!==i&&!exDone(k)&&!(e.bi&&x.bi===e.bi&&k<i));
    let target=-1;
    if(e.bi && !restSec(e)){ const p=w.ex.findIndex((x,k)=>k!==i&&x.bi===e.bi); if(p>=0&&!exDone(p)) target=p; }
    if(target<0){ for(let k=i+1;k<w.ex.length;k++) if(!exDone(k)){target=k;break;} if(target<0) target=nxt; }
    setTimeout(()=>{ a.open=target; save(); const y=scrollY; render(); scrollTo(0,y); if(target>=0){ const el=$("#ex-"+target); el&&el.scrollIntoView({behavior:"smooth",block:"start"}); } },450);
  } else if(e.bi && !restSec(e)){ const p=w.ex.findIndex((x,k)=>k!==i&&x.bi===e.bi); if(p>=0){ setTimeout(()=>{ a.open=p; save(); render(); const el=$("#ex-"+p); el&&el.scrollIntoView({behavior:"smooth",block:"start"}); },450); } }
}
function finishAsk(){
  const c=sessCounts(), w=W(S.active.w);
  openModal(`<div class="eyebrow">Treino ${w.id}</div><h2>Concluir treino?</h2>
    <p>${c.d===c.t?`Todas as <b>${c.t}</b> séries marcadas.`:`<b>${c.d}</b> de ${c.t} séries marcadas. Só as séries marcadas entram no histórico.`} As cargas serão salvas para a próxima vez.</p>
    <div class="row2"><button class="btn ghost" data-close>Voltar</button><button class="btn ok" data-confirm-finish>Concluir</button></div>`);
}
function finishSession(){
  const a=S.active, w=W(a.w), end=Date.now(), ups=[];
  const ex=[];
  w.ex.forEach((e,i)=>{ const done=a.sets[i].filter(s=>s.ok).map(s=>({kg:num(s.kg),reps:num(s.reps)}));
    if(!done.length) return;
    ex.push({n:e.n,sets:done});
    S.last[e.n]={date:end,sets:a.sets[i].map(s=>({kg:num(s.kg),reps:num(s.reps)}))};
    const top=repTop(e);
    if(done.length===a.sets[i].length && top && done.every(s=>s.reps!=null&&s.reps>=top) && !BW.has(e.n)) ups.push(e.n);
  });
  const sess={id:end,w:w.id,start:a.start,end,ex};
  if(ex.length){ S.hist.unshift(sess); S.queue.push(payload(sess,nextOf(w.id))); }
  const nx=nextOf(w.id); S.next=nx; S.active=null; save();
  stopRest(); releaseAwake(); inSession=false; tab="home"; render(); scrollTo(0,0);
  const mins=Math.round((end-a.start)/60000), sets=ex.reduce((x,e)=>x+e.sets.length,0);
  openModal(`<div class="eyebrow">Treino salvo</div><h2>Treino ${w.id} concluído</h2>
    <div class="sumgrid"><div><b>${mins}</b><span>minutos</span></div><div><b>${sets}</b><span>séries</span></div><div><b>${ex.length}</b><span>exercícios</span></div></div>
    ${ups.length?`<p>Você bateu o máximo de repetições em todas as séries. Na próxima vez, suba a carga em:</p><div class="ups">${ups.map(n=>`<div class="up">${I.up}${esc(n)}</div>`).join("")}</div>`:`<p>As cargas ficaram salvas e vão aparecer preenchidas na próxima vez.</p>`}
    <button class="btn" data-close>Próximo: Treino ${nx} · ${esc(W(nx).title)}</button>`);
  if(!ex.length) pushNext(nx);
  syncAll();
}

document.addEventListener("click",ev=>{
  const t=ev.target;
  const tb=t.closest("[data-tab]"); if(tb){ tab=tb.dataset.tab; inSession=false; render(); scrollTo(0,0); return; }
  if(t.closest("[data-scrim]")&&!t.closest(".sheet")){ closeModal(); return; }
  if(t.closest("[data-close]")){ closeModal(); return; }
  const pv=t.closest("[data-preview]"); if(pv){ previewSheet(pv.dataset.preview); return; }
  const st=t.closest("[data-start]"); if(st){ const id=st.dataset.start;
    if(S.active&&S.active.w!==id){ openModal(`<h2>Treino ${S.active.w} em andamento</h2><p>Você tem um treino aberto. Quer continuar nele ou descartar e começar o Treino ${id}?</p><div class="row2"><button class="btn ghost" data-discard-start="${id}">Descartar e iniciar ${id}</button><button class="btn" data-resume>Continuar ${S.active.w}</button></div>`); return; }
    closeModal(); if(S.active&&S.active.w===id){ inSession=true; render(); return; } newSession(id); return; }
  const ds=t.closest("[data-discard-start]"); if(ds){ closeModal(); S.active=null; newSession(ds.dataset.discardStart); return; }
  if(t.closest("[data-resume]")){ closeModal(); inSession=true; keepAwake(); render(); scrollTo(0,0); return; }
  if(t.closest("[data-home]")){ inSession=false; tab="home"; render(); scrollTo(0,0); return; }
  const x=t.closest("[data-x]"); if(x){ const i=+x.dataset.x; S.active.open = S.active.open===i?-1:i; save(); render(); if(S.active.open===i){ const el=$("#ex-"+i); el&&el.scrollIntoView({behavior:"smooth",block:"start"}); } return; }
  const ck=t.closest("[data-ck]"); if(ck){ const r=ck.closest(".srow"); toggleSet(+r.dataset.i,+r.dataset.j); return; }
  if(t.closest("[data-install]")){ if(installEvt){ installEvt.prompt(); installEvt.userChoice.finally(()=>{ installEvt=null; render(); }); } return; }
  if(t.closest("[data-install-hide]")){ installHidden=true; try{ localStorage.setItem("diario-install-hide","1"); }catch(e){} render(); return; }
  if(t.closest("[data-finish]")){ finishAsk(); return; }
  if(t.closest("[data-confirm-finish]")){ closeModal(); finishSession(); return; }
  const cn=t.closest("[data-cancel]"); if(cn){ if(cn.dataset.c){ S.active=null; save(); stopRest(); releaseAwake(); inSession=false; tab="home"; render(); scrollTo(0,0); } else { cn.dataset.c="1"; cn.textContent="Toque de novo para descartar (nada será salvo)"; setTimeout(()=>{ if(cn.isConnected){ delete cn.dataset.c; cn.textContent="Descartar treino"; } },3500); } return; }
  const rb=t.closest("[data-rest]"); if(rb){ const k=rb.dataset.rest; if(k==="add"&&REST){ REST.end+=15000; REST.total+=15000; drawRest(); } else stopRest(); return; }
  const sn=t.closest("[data-setnext]"); if(sn){ S.next=sn.dataset.setnext; save(); pushNext(S.next); render(); return; }
  if(t.closest("[data-sync]")){ syncAll(); return; }
  if(t.closest("[data-logout]")){ if(sb) sb.auth.signOut().finally(()=>{ USER=null; render(); }); return; }
  const ts=t.closest("[data-theme-set]"); if(ts){ const k=ts.dataset.themeSet; try{ localStorage.setItem(THEME_KEY,k); }catch(e){} applyTheme(); render(); return; }
  if(t.closest("[data-copy]")){ const txt=JSON.stringify({app:"diario-treino",v:1,at:Date.now(),data:{next:S.next,last:S.last,hist:S.hist}}); const ta=$("#bk"); const msg=$("#bkmsg");
    const fb=()=>{ ta.value=txt; ta.select(); msg.className="msg"; msg.textContent="Texto selecionado. Copie e guarde numa nota."; };
    try{ navigator.clipboard.writeText(txt).then(()=>{ msg.className="msg"; msg.textContent="Backup copiado. Cole numa nota para guardar."; }).catch(fb); }catch(e){ fb(); } return; }
  if(t.closest("[data-restore]")){ const msg=$("#bkmsg"); try{ const o=JSON.parse($("#bk").value); if(o.app!=="diario-treino"||!o.data) throw 0; S.next=o.data.next||"A"; S.last=o.data.last||{}; S.hist=o.data.hist||[]; save(); render(); const m2=$("#bkmsg"); if(m2){ m2.className="msg"; m2.textContent=`Restaurado: ${S.hist.length} treinos no histórico.`; } }catch(e){ msg.className="msg bad"; msg.textContent="Texto inválido. Cole o backup completo, do jeito que foi copiado."; } return; }
  const wp=t.closest("[data-wipe]"); if(wp){ if(wp.dataset.c){ S={next:"A",last:{},hist:[],active:null}; save(); stopRest(); render(); } else { wp.dataset.c="1"; wp.textContent="Toque de novo para apagar"; setTimeout(()=>{ if(wp.isConnected){ delete wp.dataset.c; wp.textContent="Apagar tudo"; } },3500); } return; }
});
document.addEventListener("input",ev=>{
  const inp=ev.target; if(!inp.matches(".srow input")) return;
  const r=inp.closest(".srow"), i=+r.dataset.i, j=+r.dataset.j, k=inp.dataset.k;
  S.active.sets[i][j][k]=inp.value.replace(/[^\d.,]/g,"");
  if(k==="kg"){ for(let q=j+1;q<S.active.sets[i].length;q++){ const s=S.active.sets[i][q]; if(!s.ok&&!s.touched){ s.kg=inp.value; const el=$(`#kg-${i}-${q}`); if(el) el.value=inp.value; } } S.active.sets[i][j].touched=true; }
  save();
});
document.addEventListener("focusin",ev=>{ if(ev.target.matches(".srow input")) setTimeout(()=>{ try{ ev.target.select(); }catch(e){} },30); });

function applyTheme(){ let th="auto"; try{ th=localStorage.getItem(THEME_KEY)||"auto"; }catch(e){} const r=document.documentElement; if(th==="auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme",th); }
applyTheme();
document.addEventListener("submit",async ev=>{
  if(ev.target.id!=="login") return; ev.preventDefault();
  const msg=$("#lgmsg"), btn=ev.target.querySelector("button"); msg.className="msg"; msg.textContent="Entrando…"; btn.disabled=true;
  try{ const {data,error}=await sb.auth.signInWithPassword({email:$("#lg-email").value.trim(),password:$("#lg-pass").value});
    if(error) throw error; USER=data.user; document.activeElement&&document.activeElement.blur(); await syncAll(); render(); }
  catch(e){ msg.className="msg bad"; msg.textContent=/invalid/i.test(e.message||"")?"E-mail ou senha incorretos.":errMsg(e); btn.disabled=false; }
});
if(S.active) keepAwake();
if(!Array.isArray(S.queue)){ // primeira vez: o que já está no celular entra na fila de envio
  S.queue=[]; [...S.hist].sort((a,b)=>a.end-b.end).forEach(h=>S.queue.push(payload(h,nextOf(h.w)))); save();
}
render();
initCloud();
</script>
<script>
if("serviceWorker" in navigator && location.protocol==="https:"){ window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); }); }
</script>
